# 原始来源根目录(LLM 永不修改)
sources_raw:
  root: raw/
  layout:
    github: raw/github/<owner>/<repo>/
    papers: raw/PDFs/papers/
    books: raw/PDFs/books/
    slides: raw/PDFs/slides/
    bookmarks: raw/bookmarks/
    web: raw/web/
    notes: raw/notes/

# 摘要页面目录
