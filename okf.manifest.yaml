# 引用此 pack 的方式
how_to_consume:
  - "在 Obsidian 中打开 wiki/ 目录作为 Vault"
  - "运行 python3 scripts/lint_okf.py --check 验证合规性"
  - "喂给 OKF 兼容 Agent(Claude Code / Codex / Gemini),入口文件 wiki/index.md"
  - "新来源放入 raw/ 对应子目录,告诉 Agent 'ingest [路径]'"
